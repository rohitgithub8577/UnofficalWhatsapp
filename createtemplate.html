<input type="hidden" id="hideregid" />

<script>
if(!sessionStorage.getItem("userid")){
window.location.href="login.html";
}
$(document).ready(function(){
const role=sessionStorage.getItem("role");
const token = sessionStorage.getItem("tokenid");
    $("#txttoken").val(token);
if(role!=="admin"){
$("#registrationmenu").hide();
}
$("#lbluser").html(sessionStorage.getItem("fullname"));
$("#lblroles").html(sessionStorage.getItem("role"));
});

function doLogout(){
sessionStorage.clear();
window.location.href="login.html";
}

async function sendwhatsapp() {
    const countrycode  = $("#txtcountrycode").val();
    const mobileno     = $("#txtmobileno").val();
    const token        = $("#txttoken").val();
    const temp = document.createElement("div");
    temp.innerHTML = $("#txtbodytemplate").html();
    temp.querySelectorAll("div").forEach(div => {
        div.insertAdjacentText("beforebegin", "\n");
    });
    const bodytemplate = temp.textContent.trim();
// console.log(JSON.stringify(bodytemplate));
    let file = "";
      const fileInput = $("#txtdocument")[0];

      if (fileInput.files.length > 0) {
          file = fileInput.files[0];
      }
    const formData = new FormData();
    formData.append("token", token);
    formData.append("number", countrycode + mobileno);
    formData.append("message", bodytemplate);
    if (file) {
        formData.append("file", file);
    }
    try {
        const response = await fetch("/send", {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        if (data.success) {
         showSuccessMessage("Message sent successfully");
            cleardata();
        } else {
            showErrorMessage(data.error);
        }
    } catch (err) {
     showErrorMessage("Send failed");
    }

}

function cleardata()
{
    $("#txttemplatename").val('');
    $("#txtcountrycode").val('');
    $("#txtmobileno").val('');
    $("#txtbodytemplate").html('');
    $("#txtdocument").val('');
}


function showErrorMessage(message){
clearTimeout(window.errorTimer);
$("#errormsg").html(message + "<div class='cross' onclick='closeerrormsg();'>✕</div>");
$("#errormsg").fadeIn();

window.errorTimer=setTimeout(function(){
$("#errormsg").fadeOut();
},3000);

}

function showSuccessMessage(message){

clearTimeout(window.successTimer);

$("#successmsg").html(message + "<div class='cross' onclick='closesuccessmsg();'>✕</div>");

$("#successmsg").fadeIn();

window.successTimer=setTimeout(function(){
$("#successmsg").fadeOut();
},3000);

}

function closeerrormsg(){
$("#errormsg").fadeOut();
}

function closesuccessmsg(){
$("#successmsg").fadeOut();
}


let sidebarOpen = true;
function toggleSidebar() {
  const sb = document.getElementById('wamSidebar');
  const main = document.getElementById('wamMain');
  const btn = document.getElementById('wamToggle');
  sidebarOpen = !sidebarOpen;
  if (!sidebarOpen) {
    sb.classList.add('wam-collapsed');
    main.classList.add('wam-main-collapsed');
    btn.textContent = '❯';
    btn.title = 'Expand Menu';
  } else {
    sb.classList.remove('wam-collapsed');
    main.classList.remove('wam-main-collapsed');
    btn.textContent = '❮';
    btn.title = 'Collapse Menu';
  }
}
function allowOnlyNumbers(obj) {
    obj.value = obj.value.replace(/[^0-9]/g, '');
}
</script>
